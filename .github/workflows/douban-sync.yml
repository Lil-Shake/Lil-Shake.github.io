name: Sync Douban films

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "How many of the newest watched-list pages to fetch (15 films each, 0 = everything)"
        default: "3"
  schedule:
    - cron: "0 2 * * 1"   # every Monday 10:00 Singapore time

permissions:
  contents: write

concurrency:
  group: douban-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Fetch from Douban
        run: python3 scripts/douban_sync.py --pages "${{ github.event.inputs.pages || '3' }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/movies.json images/movies _film_reviews images/film-reviews
          if git diff --cached --quiet; then
            echo "Nothing new on Douban."
          else
            git commit -m "Sync Douban films"
            git push
          fi
